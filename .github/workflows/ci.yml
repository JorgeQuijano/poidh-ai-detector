name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manifest.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))" \
            && echo "manifest.json OK"
      - name: Validate all JSON / JS files parse
        run: |
          find extension eval -type f \( -name "*.json" -o -name "*.js" -o -name "*.mjs" \) \
            -exec node --check {} \; 2>/dev/null || true
          # Above is best-effort; modules aren't standalone. We at least check JSON.
          for f in $(find extension eval -type f -name "*.json"); do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1
          done
          echo "JSON files parse OK"
      - name: Check extension size budget (<= 340MB)
        run: bash scripts/check-size.sh
      - name: List extension tree
        run: |
          find extension -maxdepth 3 -type f | sort
