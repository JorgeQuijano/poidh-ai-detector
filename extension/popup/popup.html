<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>poidh AI image detector</title>
  <style>
    body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; min-width: 260px; color: #222; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    .muted { color: #777; font-size: 11px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 8px; }
    .stats div { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>poidh AI image detector</h1>
  <div class="row">
    <label for="enabled">Enable overlay</label>
    <input type="checkbox" id="enabled" checked />
  </div>
  <div class="row">
    <span class="muted">model</span>
    <span id="model" class="muted">detector-int8-v0.1.0</span>
  </div>
  <div class="row">
    <span class="muted">scored</span>
    <span id="scored" class="muted">0</span>
  </div>
  <div class="stats">
    <div>ai</div><div id="ai">0</div>
    <div>real</div><div id="real">0</div>
    <div>uncertain</div><div id="uncertain">0</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
